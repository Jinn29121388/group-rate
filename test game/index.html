<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم رای‌گیری</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>سیستم رای‌گیری</h1>
        <p>لطفاً به این موضوع رای بدهید:</p>
        <p>از ستاد مبارزه با مهدی ناس راضی هستید؟</p>

        <button id="vote-yes">بله</button>
        <button id="vote-no">خیر</button>

        <h2>نتایج رای‌گیری:</h2>
        <p>بله: <span id="yes-count">0</span> رای</p>
        <p>خیر: <span id="no-count">0</span> رای</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
